name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "serde1", "mimalloc", "serde1,mimalloc"]

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --no-default-features --features "${{ matrix.features }}"
    - name: Run tests
      run: cargo test --workspace --verbose --no-default-features --features "${{ matrix.features }}"
